<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Drawing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            font-size: 1.5em;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
        }

        .status-indicator.connected {
            background: #44ff44;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            padding: 20px;
        }

        .canvas-container {
            border: 3px solid #667eea;
            border-radius: 10px;
            overflow: hidden;
            background: white;
        }

        canvas {
            display: block;
            cursor: crosshair;
            touch-action: none;
            width: 100%;
            height: auto;
        }

        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f8f9ff;
            border-radius: 10px;
            padding: 20px;
            min-width: 200px;
        }

        .tool-section {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
        }

        .tool-section h3 {
            color: #667eea;
            font-size: 1em;
            margin-bottom: 10px;
        }

        .color-palette {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .color-btn {
            width: 40px;
            height: 40px;
            border: 3px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .color-btn.selected {
            border-color: #333;
            transform: scale(1.15);
        }

        .brush-sizes {
            display: flex;
            gap: 10px;
            justify-content: space-around;
        }

        .size-btn {
            width: 45px;
            height: 45px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .size-btn.selected {
            border-color: #667eea;
            background: #667eea;
        }

        .size-btn .dot {
            background: #333;
            border-radius: 50%;
        }

        .size-btn.selected .dot {
            background: white;
        }

        .tool-btn {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tool-btn.active {
            background: #667eea;
            color: white;
        }

        .clear-btn {
            background: #ff4444;
            color: white;
            border-color: #ff4444;
        }

        .room-info input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .peers-list {
            margin-top: 10px;
            font-size: 0.85em;
            color: #666;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .toolbar {
                flex-direction: row;
                overflow-x: auto;
                min-width: unset;
            }
            .tool-section {
                min-width: 200px;
            }
        }

        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .intro-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            margin: 20px;
            text-align: center;
        }

        .intro-card h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .intro-card p {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .intro-card input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            margin-bottom: 15px;
        }

        .intro-card button {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .server-url {
            font-size: 0.85em;
            color: #666;
            margin-top: 15px;
            padding: 10px;
            background: #fff3cd;
            border-radius: 5px;
            border: 1px solid #ffc107;
        }

        .server-url input {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            font-size: 0.9em;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="intro-overlay" id="introOverlay">
        <div class="intro-card">
            <h2>🎨 Collaborative Drawing</h2>
            <p><strong>Draw together in real-time!</strong></p>

            <div class="server-url">
                <strong>✅ Server Connected</strong><br>
                WebSocket server URL:
                <input type="text" id="serverUrl" placeholder="wss://ideas-app-production.up.railway.app" value="wss://ideas-app-production.up.railway.app" />
                <small>You can change this if needed</small>
            </div>

            <input type="text" id="roomInput" placeholder="Enter room name (e.g., 'party')" style="margin-top: 15px;" />
            <button id="joinButton" style="margin-top: 10px;">Join Room</button>
            <div id="statusMessage" style="margin-top: 10px; font-size: 0.85em; color: #666;"></div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>🎨 Collaborative Drawing</h1>
            <div class="connection-status">
                <div class="status-indicator" id="statusIndicator"></div>
                <span id="statusText">Not connected</span>
            </div>
        </div>

        <div class="main-content">
            <div class="canvas-container">
                <canvas id="drawingCanvas" width="800" height="600"></canvas>
            </div>

            <div class="toolbar">
                <div class="tool-section room-info">
                    <h3>Room</h3>
                    <input type="text" id="roomName" readonly />
                    <div class="peers-list" id="peersList">Not connected</div>
                </div>

                <div class="tool-section">
                    <h3>Colors</h3>
                    <div class="color-palette" id="colorPalette">
                        <div class="color-btn selected" style="background: #000000;" data-color="#000000"></div>
                        <div class="color-btn" style="background: #ff0000;" data-color="#ff0000"></div>
                        <div class="color-btn" style="background: #00ff00;" data-color="#00ff00"></div>
                        <div class="color-btn" style="background: #0000ff;" data-color="#0000ff"></div>
                        <div class="color-btn" style="background: #ffff00;" data-color="#ffff00"></div>
                        <div class="color-btn" style="background: #ff00ff;" data-color="#ff00ff"></div>
                        <div class="color-btn" style="background: #00ffff;" data-color="#00ffff"></div>
                        <div class="color-btn" style="background: #ffffff; border: 2px solid #ccc;" data-color="#ffffff"></div>
                        <div class="color-btn" style="background: #ff8800;" data-color="#ff8800"></div>
                        <div class="color-btn" style="background: #88ff00;" data-color="#88ff00"></div>
                        <div class="color-btn" style="background: #0088ff;" data-color="#0088ff"></div>
                        <div class="color-btn" style="background: #8800ff;" data-color="#8800ff"></div>
                        <div class="color-btn" style="background: #ff0088;" data-color="#ff0088"></div>
                        <div class="color-btn" style="background: #888888;" data-color="#888888"></div>
                        <div class="color-btn" style="background: #cc6633;" data-color="#cc6633"></div>
                        <div class="color-btn" style="background: #663399;" data-color="#663399"></div>
                    </div>
                </div>

                <div class="tool-section">
                    <h3>Brush Size</h3>
                    <div class="brush-sizes" id="brushSizes">
                        <div class="size-btn" data-size="2"><div class="dot" style="width: 4px; height: 4px;"></div></div>
                        <div class="size-btn selected" data-size="5"><div class="dot" style="width: 8px; height: 8px;"></div></div>
                        <div class="size-btn" data-size="10"><div class="dot" style="width: 14px; height: 14px;"></div></div>
                        <div class="size-btn" data-size="20"><div class="dot" style="width: 24px; height: 24px;"></div></div>
                    </div>
                </div>

                <div class="tool-section">
                    <h3>Tools</h3>
                    <button class="tool-btn active" id="drawBtn">✏️ Draw</button>
                    <button class="tool-btn" id="eraseBtn">🧹 Erase</button>
                </div>

                <div class="tool-section">
                    <button class="tool-btn clear-btn" id="clearBtn">🗑️ Clear Canvas</button>
                    <button class="tool-btn" id="saveBtn" style="margin-top: 10px; background: #28a745; color: white; border-color: #28a745;">💾 Save Drawing</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');

        let isDrawing = false;
        let currentColor = '#000000';
        let currentSize = 5;
        let currentTool = 'draw';
        let lastX = 0, lastY = 0;

        let ws = null;
        let roomName = '';
        let peerCount = 0;
        let serverUrl = '';
        let reconnectAttempts = 0;
        let reconnectTimeout = null;
        let isIntentionalDisconnect = false;

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        function showStatus(msg) {
            document.getElementById('statusMessage').textContent = msg;
        }

        function updateConnectionStatus(connected, peers = 0, reconnecting = false) {
            const indicator = document.getElementById('statusIndicator');
            const text = document.getElementById('statusText');
            const peersList = document.getElementById('peersList');

            if (connected) {
                indicator.classList.add('connected');
                text.textContent = 'Connected';
                peersList.textContent = `${peers} other${peers !== 1 ? 's' : ''} in room`;
                reconnectAttempts = 0;
            } else if (reconnecting) {
                indicator.classList.remove('connected');
                text.textContent = 'Reconnecting...';
                peersList.textContent = 'Reconnecting...';
            } else {
                indicator.classList.remove('connected');
                text.textContent = 'Not connected';
                peersList.textContent = 'Not connected';
            }
        }

        function scheduleReconnect() {
            if (isIntentionalDisconnect || !serverUrl || !roomName) return;

            const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
            reconnectAttempts++;

            updateConnectionStatus(false, 0, true);

            if (reconnectTimeout) clearTimeout(reconnectTimeout);
            reconnectTimeout = setTimeout(() => {
                console.log(`Reconnecting... (attempt ${reconnectAttempts})`);
                connectWebSocket(serverUrl, roomName);
            }, delay);
        }

        function connectWebSocket(url, room) {
            serverUrl = url;
            roomName = room;
            isIntentionalDisconnect = false;

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            }

            showStatus('Connecting to server...');

            ws = new WebSocket(serverUrl);

            ws.onopen = () => {
                showStatus('Connected! Joining room...');
                ws.send(JSON.stringify({
                    type: 'join',
                    room: roomName
                }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'joined') {
                    showStatus('');
                    peerCount = data.peers;
                    updateConnectionStatus(true, peerCount);
                    document.getElementById('introOverlay').classList.add('hidden');
                } else if (data.type === 'stroke') {
                    drawLine(data.x1, data.y1, data.x2, data.y2, data.color, data.size, data.tool);
                } else if (data.type === 'clear') {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onclose = () => {
                updateConnectionStatus(false);
                if (!isIntentionalDisconnect) {
                    scheduleReconnect();
                }
            };
        }

        document.getElementById('joinButton').addEventListener('click', () => {
            const serverUrl = document.getElementById('serverUrl').value.trim();
            const room = document.getElementById('roomInput').value.trim();

            if (!serverUrl) {
                showStatus('Please enter server URL!');
                return;
            }

            if (!room) {
                showStatus('Please enter room name!');
                return;
            }

            document.getElementById('roomName').value = room;
            connectWebSocket(serverUrl, room);
        });

        function send(data) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(data));
            }
        }

        function drawLine(x1, y1, x2, y2, color, size, tool) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = tool === 'erase' ? '#ffffff' : color;
            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const touch = e.touches && e.touches[0];
            return {
                x: ((touch ? touch.clientX : e.clientX) - rect.left) * scaleX,
                y: ((touch ? touch.clientY : e.clientY) - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            e.preventDefault();
            isDrawing = true;
            const coords = getCanvasCoords(e);
            lastX = coords.x;
            lastY = coords.y;
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const coords = getCanvasCoords(e);

            drawLine(lastX, lastY, coords.x, coords.y, currentColor, currentSize, currentTool);

            send({
                type: 'stroke',
                x1: lastX,
                y1: lastY,
                x2: coords.x,
                y2: coords.y,
                color: currentColor,
                size: currentSize,
                tool: currentTool
            });

            lastX = coords.x;
            lastY = coords.y;
        }

        function stopDrawing(e) {
            if (e) e.preventDefault();
            isDrawing = false;
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        document.getElementById('colorPalette').addEventListener('click', (e) => {
            if (e.target.classList.contains('color-btn')) {
                currentColor = e.target.dataset.color;
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
                e.target.classList.add('selected');
            }
        });

        document.getElementById('brushSizes').addEventListener('click', (e) => {
            const btn = e.target.closest('.size-btn');
            if (btn) {
                currentSize = parseInt(btn.dataset.size);
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            }
        });

        document.getElementById('drawBtn').addEventListener('click', function() {
            currentTool = 'draw';
            document.getElementById('eraseBtn').classList.remove('active');
            this.classList.add('active');
        });

        document.getElementById('eraseBtn').addEventListener('click', function() {
            currentTool = 'erase';
            document.getElementById('drawBtn').classList.remove('active');
            this.classList.add('active');
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            send({ type: 'clear' });
        });

        document.getElementById('saveBtn').addEventListener('click', () => {
            // Convert canvas to blob and download
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `drawing-${Date.now()}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 'image/png');
        });
    </script>
</body>
</html>
