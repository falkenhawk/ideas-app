<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Low Poly Builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #toolbar {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            z-index: 100;
            max-width: 300px;
            transition: transform 0.3s, opacity 0.3s;
        }

        #toolbar.collapsed {
            transform: translateX(-320px);
            opacity: 0;
            pointer-events: none;
        }

        #toolbar-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            z-index: 101;
            cursor: pointer;
            font-size: 24px;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        #toolbar-toggle:active {
            transform: scale(0.95);
        }

        #toolbar-toggle.show {
            display: flex;
        }

        #toolbar h3 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: #333;
        }

        .section {
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .shape-buttons, .color-palette {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .shape-btn, .color-btn {
            width: 50px;
            height: 50px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .shape-btn:hover, .color-btn:hover {
            transform: scale(1.1);
            border-color: #667eea;
        }

        .shape-btn.active, .color-btn.active {
            border-color: #667eea;
            background: #f0f4ff;
            border-width: 3px;
        }

        .color-btn {
            border: 3px solid #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .color-btn.active {
            box-shadow: 0 0 0 3px #667eea;
        }

        .mode-buttons {
            display: flex;
            gap: 8px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }

        .mode-btn:hover {
            border-color: #667eea;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .mode-btn.delete.active {
            background: #ef4444;
            border-color: #ef4444;
        }

        #status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #intro-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #intro-overlay.hidden {
            display: none;
        }

        .intro-content {
            background: white;
            padding: 40px;
            border-radius: 16px;
            max-width: 400px;
            text-align: center;
        }

        .intro-content h1 {
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .intro-content p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .intro-content input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .intro-content button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .intro-content button:hover {
            transform: scale(1.02);
        }

        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            pointer-events: none;
            z-index: 50;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
        }

        #crosshair::before {
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            transform: translateY(-50%);
        }

        #crosshair::after {
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            transform: translateX(-50%);
        }

        #place-btn {
            position: absolute;
            bottom: 100px;
            right: 20px;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 100;
            cursor: pointer;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        #place-btn:active {
            transform: scale(0.9);
        }

        #place-btn.delete-mode {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .toolbar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .toolbar-header h3 {
            margin: 0;
        }

        .collapse-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            line-height: 1;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .collapse-btn:hover {
            opacity: 1;
        }

        @media (max-width: 768px) {
            #controls-hint {
                font-size: 12px;
                padding: 8px 15px;
                bottom: 10px;
            }
        }

        #debug-message {
            position: fixed;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 200;
            display: none;
            max-width: 80%;
            text-align: center;
        }

        #debug-message.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        #debug-message.error {
            background: rgba(239, 68, 68, 0.95);
        }

        #debug-message.success {
            background: rgba(34, 197, 94, 0.95);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
    <div id="intro-overlay">
        <div class="intro-content">
            <h1>🏗️ Low Poly Builder</h1>
            <p>Build amazing 3D worlds together in real-time!</p>
            <input type="text" id="serverUrl" placeholder="Server URL" value="wss://ideas-app-production.up.railway.app">
            <input type="text" id="roomInput" placeholder="Enter room name" value="world1">
            <button id="joinButton">Join Room</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <button id="toolbar-toggle" onclick="toggleToolbar()">🎨</button>

    <div id="toolbar">
        <div class="toolbar-header">
            <h3>🎨 Builder Tools</h3>
            <button class="collapse-btn" onclick="toggleToolbar()">✕</button>
        </div>

        <div class="section">
            <div class="section-title">Mode</div>
            <div class="mode-buttons">
                <button class="mode-btn active" data-mode="build">🔨 Build</button>
                <button class="mode-btn delete" data-mode="delete">🗑️ Delete</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Shapes</div>
            <div class="shape-buttons">
                <button class="shape-btn active" data-shape="cube" title="Cube">🟦</button>
                <button class="shape-btn" data-shape="pyramid" title="Pyramid">🔺</button>
                <button class="shape-btn" data-shape="sphere" title="Sphere">⚪</button>
                <button class="shape-btn" data-shape="cylinder" title="Cylinder">⚫</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Colors</div>
            <div class="color-palette">
                <button class="color-btn active" style="background: #ef4444;" data-color="#ef4444"></button>
                <button class="color-btn" style="background: #f59e0b;" data-color="#f59e0b"></button>
                <button class="color-btn" style="background: #eab308;" data-color="#eab308"></button>
                <button class="color-btn" style="background: #22c55e;" data-color="#22c55e"></button>
                <button class="color-btn" style="background: #3b82f6;" data-color="#3b82f6"></button>
                <button class="color-btn" style="background: #8b5cf6;" data-color="#8b5cf6"></button>
                <button class="color-btn" style="background: #ec4899;" data-color="#ec4899"></button>
                <button class="color-btn" style="background: #ffffff;" data-color="#ffffff"></button>
                <button class="color-btn" style="background: #6b7280;" data-color="#6b7280"></button>
                <button class="color-btn" style="background: #000000;" data-color="#000000"></button>
            </div>
        </div>
    </div>

    <div id="crosshair"></div>

    <button id="place-btn" onclick="placeBlockAtCenter()">🔨</button>

    <div id="status">
        <span class="status-dot"></span>
        <span id="statusText">Connecting...</span>
    </div>

    <div id="controls-hint">
        📱 Tap 🔨 to place | Drag to rotate view | Pinch to zoom
    </div>

    <div id="debug-message"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Global state
        let scene, camera, renderer, controls;
        let ws, roomName;
        let currentMode = 'build';
        let currentShape = 'cube';
        let currentColor = '#ef4444';
        let blocks = new Map(); // blockId -> mesh
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let gridHelper, groundPlane;
        const GRID_SIZE = 50;
        const BLOCK_SIZE = 1;

        // UI Helper functions
        let messageTimeout;
        function showMessage(text, type = 'info') {
            const msgDiv = document.getElementById('debug-message');
            msgDiv.textContent = text;
            msgDiv.className = 'show ' + type;

            if (messageTimeout) clearTimeout(messageTimeout);
            messageTimeout = setTimeout(() => {
                msgDiv.classList.remove('show');
            }, 3000);
        }

        window.toggleToolbar = function() {
            const toolbar = document.getElementById('toolbar');
            const toggleBtn = document.getElementById('toolbar-toggle');

            toolbar.classList.toggle('collapsed');

            // Show toggle button when toolbar is collapsed
            if (toolbar.classList.contains('collapsed')) {
                toggleBtn.classList.add('show');
            } else {
                toggleBtn.classList.remove('show');
            }
        };

        window.placeBlockAtCenter = function() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showMessage('❌ Not connected to server!', 'error');
                return;
            }

            // Raycast from center of screen
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length === 0) {
                showMessage('❌ Aim crosshair at ground or block!', 'error');
                return;
            }

            const intersect = intersects[0];

            if (currentMode === 'delete') {
                // Delete mode
                if (intersect.object.userData.blockId) {
                    const blockId = intersect.object.userData.blockId;
                    send({
                        type: 'removeBlock',
                        blockId: blockId
                    });
                    showMessage('🗑️ Block deleted!', 'success');
                } else {
                    showMessage('❌ Aim at a block to delete!', 'error');
                }
            } else {
                // Build mode
                let position = null;

                if (intersect.object.userData.isGround) {
                    position = new THREE.Vector3();
                    position.copy(intersect.point);
                    position.y = BLOCK_SIZE / 2;
                } else if (intersect.object.userData.blockId) {
                    position = new THREE.Vector3();
                    position.copy(intersect.point);
                    position.add(intersect.face.normal);
                    position.divideScalar(BLOCK_SIZE).floor().multiplyScalar(BLOCK_SIZE);
                    position.addScalar(BLOCK_SIZE / 2);
                } else {
                    showMessage('❌ Can only place on ground or blocks!', 'error');
                    return;
                }

                if (position) {
                    // Snap to grid
                    position.x = Math.round(position.x);
                    position.y = Math.max(BLOCK_SIZE / 2, Math.round(position.y));
                    position.z = Math.round(position.z);

                    // Check bounds
                    if (Math.abs(position.x) > GRID_SIZE / 2 ||
                        Math.abs(position.z) > GRID_SIZE / 2 ||
                        position.y <= 0) {
                        showMessage('❌ Too far from center!', 'error');
                        return;
                    }

                    const blockId = `${Date.now()}_${Math.random()}`;
                    send({
                        type: 'addBlock',
                        blockId: blockId,
                        x: position.x,
                        y: position.y,
                        z: position.z,
                        shape: currentShape,
                        color: currentColor
                    });
                    showMessage('✅ Block placed!', 'success');
                }
            }
        };

        function updatePlaceButton() {
            const placeBtn = document.getElementById('place-btn');
            if (currentMode === 'delete') {
                placeBtn.classList.add('delete-mode');
                placeBtn.textContent = '🗑️';
            } else {
                placeBtn.classList.remove('delete-mode');
                placeBtn.textContent = '🔨';
            }
        }

        // Initialize Three.js scene
        function initScene() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 50, 100);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(10, 10, 10);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 5;
            controls.maxDistance = 50;
            controls.maxPolarAngle = Math.PI / 2 - 0.1; // Prevent going below ground

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.camera.left = -20;
            directionalLight.shadow.camera.right = 20;
            directionalLight.shadow.camera.top = 20;
            directionalLight.shadow.camera.bottom = -20;
            scene.add(directionalLight);

            // Grid
            gridHelper = new THREE.GridHelper(GRID_SIZE, GRID_SIZE);
            gridHelper.material.opacity = 0.3;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);

            // Ground plane (invisible, for raycasting)
            const groundGeometry = new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE);
            const groundMaterial = new THREE.MeshBasicMaterial({ visible: false });
            groundPlane = new THREE.Mesh(groundGeometry, groundMaterial);
            groundPlane.rotation.x = -Math.PI / 2;
            groundPlane.userData.isGround = true;
            scene.add(groundPlane);

            // Handle window resize
            window.addEventListener('resize', onWindowResize);

            // Mouse events
            renderer.domElement.addEventListener('click', onCanvasClick);

            // Animation loop
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function createBlockGeometry(shape) {
            switch (shape) {
                case 'cube':
                    return new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                case 'pyramid':
                    return new THREE.ConeGeometry(BLOCK_SIZE / 2, BLOCK_SIZE, 4);
                case 'sphere':
                    return new THREE.SphereGeometry(BLOCK_SIZE / 2, 8, 6);
                case 'cylinder':
                    return new THREE.CylinderGeometry(BLOCK_SIZE / 2, BLOCK_SIZE / 2, BLOCK_SIZE, 8);
                default:
                    return new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            }
        }

        function createBlock(blockId, x, y, z, shape, color) {
            const geometry = createBlockGeometry(shape);
            const material = new THREE.MeshStandardMaterial({
                color: color,
                flatShading: true,
                roughness: 0.8,
                metalness: 0.2
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData.blockId = blockId;
            mesh.userData.shape = shape;
            mesh.userData.color = color;

            scene.add(mesh);
            blocks.set(blockId, mesh);
            return mesh;
        }

        function removeBlock(blockId) {
            const mesh = blocks.get(blockId);
            if (mesh) {
                scene.remove(mesh);
                mesh.geometry.dispose();
                mesh.material.dispose();
                blocks.delete(blockId);
            }
        }

        function onCanvasClick(event) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            // Calculate mouse position in normalized device coordinates
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            // Raycast
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                const intersect = intersects[0];

                if (currentMode === 'delete') {
                    // Delete mode: remove the clicked block
                    if (intersect.object.userData.blockId) {
                        const blockId = intersect.object.userData.blockId;
                        send({
                            type: 'removeBlock',
                            blockId: blockId
                        });
                    }
                } else {
                    // Build mode: place a new block
                    let position;

                    if (intersect.object.userData.isGround) {
                        // Clicking on ground - place at grid position
                        position = new THREE.Vector3();
                        position.copy(intersect.point);
                        position.y = BLOCK_SIZE / 2; // Half block size to sit on ground
                    } else if (intersect.object.userData.blockId) {
                        // Clicking on existing block - place adjacent
                        position = new THREE.Vector3();
                        position.copy(intersect.point);
                        position.add(intersect.face.normal);
                        position.divideScalar(BLOCK_SIZE).floor().multiplyScalar(BLOCK_SIZE);
                        position.addScalar(BLOCK_SIZE / 2);
                    }

                    if (position) {
                        // Snap to grid
                        position.x = Math.round(position.x);
                        position.y = Math.max(BLOCK_SIZE / 2, Math.round(position.y));
                        position.z = Math.round(position.z);

                        // Check bounds
                        if (Math.abs(position.x) <= GRID_SIZE / 2 &&
                            Math.abs(position.z) <= GRID_SIZE / 2 &&
                            position.y > 0) {

                            const blockId = `${Date.now()}_${Math.random()}`;
                            send({
                                type: 'addBlock',
                                blockId: blockId,
                                x: position.x,
                                y: position.y,
                                z: position.z,
                                shape: currentShape,
                                color: currentColor
                            });
                        }
                    }
                }
            }
        }

        // WebSocket connection
        function connectWebSocket(url, room) {
            roomName = room;
            ws = new WebSocket(url);

            ws.onopen = () => {
                console.log('Connected to server');
                send({ type: 'join', room: roomName });
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'joined') {
                    document.getElementById('statusText').textContent = `Room: ${roomName} (${data.peers} online)`;
                    document.getElementById('intro-overlay').classList.add('hidden');

                    // Load existing blocks
                    if (data.blocks && data.blocks.length > 0) {
                        data.blocks.forEach(block => {
                            createBlock(block.blockId, block.x, block.y, block.z, block.shape, block.color);
                        });
                    }
                } else if (data.type === 'addBlock') {
                    createBlock(data.blockId, data.x, data.y, data.z, data.shape, data.color);
                } else if (data.type === 'removeBlock') {
                    removeBlock(data.blockId);
                } else if (data.type === 'clear') {
                    // Clear all blocks
                    blocks.forEach((mesh, blockId) => {
                        removeBlock(blockId);
                    });
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                document.getElementById('statusText').textContent = 'Connection error';
            };

            ws.onclose = () => {
                document.getElementById('statusText').textContent = 'Disconnected';
            };
        }

        function send(data) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(data));
            }
        }

        // UI Event Handlers
        document.getElementById('joinButton').addEventListener('click', () => {
            const serverUrl = document.getElementById('serverUrl').value.trim();
            const room = document.getElementById('roomInput').value.trim();

            if (!serverUrl || !room) {
                alert('Please enter server URL and room name');
                return;
            }

            connectWebSocket(serverUrl, room);
        });

        // Mode buttons
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                updatePlaceButton();
            });
        });

        // Shape buttons
        document.querySelectorAll('.shape-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentShape = btn.dataset.shape;
            });
        });

        // Color buttons
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentColor = btn.dataset.color;
            });
        });

        // Initialize scene on load
        initScene();
        updatePlaceButton();
    </script>
</body>
</html>
